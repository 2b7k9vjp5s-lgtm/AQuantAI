name: Local Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  pytest-and-demo:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aquantai
          POSTGRES_PASSWORD: aquantai
          POSTGRES_DB: aquantai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aquantai -d aquantai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://aquantai:aquantai@127.0.0.1:5432/aquantai_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply one-time exact Workbench remediation
        if: github.event_name == 'pull_request'
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("industry_alpha/industry_thesis_owner_acceptance_workbench.py")
          text = path.read_text(encoding="utf-8")
          old_context = '''        best_size = max(len(values) for values in context_coverage.values())
                  best_contexts = [
                      key for key, values in context_coverage.items() if len(values) == best_size
                  ]
                  if len(best_contexts) != 1:
                      raise IndustryThesisOwnerAcceptanceError(
                          "INDUSTRY_THESIS_ACCEPTANCE_EXACT_MAP_REQUIRED",
                          "multiple exact case/map contexts are equally compatible",
                      )
                  case_id, map_id, map_revision_id = best_contexts[0]
          '''
          new_context = '''        if len(context_coverage) != 1:
                      raise IndustryThesisOwnerAcceptanceError(
                          "INDUSTRY_THESIS_ACCEPTANCE_EXACT_MAP_REQUIRED",
                          "multiple exact case/map contexts are reachable for the frozen identities",
                      )
                  selected_context, compatible_stock_ids = next(iter(context_coverage.items()))
                  case_id, map_id, map_revision_id = selected_context
          '''
          old_research = '''        research_rows = list(
                      self._session.execute(
                          select(Stage2CompanyResearch, Stage2CompanyResearchRevision)
                          .join(
                              Stage2CompanyResearchRevision,
                              Stage2CompanyResearchRevision.company_research_id
                              == Stage2CompanyResearch.id,
                          )
                          .where(
                              Stage2CompanyResearch.beneficiary_revision_id.in_(revision_ids),
                              Stage2CompanyResearchRevision.information_cutoff_date <= as_of_cutoff,
                              Stage2CompanyResearchRevision.recorded_at_utc <= recorded_boundary,
                          )
                          .order_by(
                              Stage2CompanyResearch.id,
                              Stage2CompanyResearchRevision.revision_no,
                          )
                      )
                  )
          '''
          new_research = '''        research_rows: list[
                      tuple[Stage2CompanyResearch, Stage2CompanyResearchRevision]
                  ] = []
                  if pool is not None and pool_revision is not None:
                      research_rows = list(
                          self._session.execute(
                              select(Stage2CompanyResearch, Stage2CompanyResearchRevision)
                              .join(
                                  Stage2CompanyResearchRevision,
                                  Stage2CompanyResearchRevision.company_research_id
                                  == Stage2CompanyResearch.id,
                              )
                              .join(
                                  Stage1CandidatePoolMembership,
                                  Stage1CandidatePoolMembership.id
                                  == Stage2CompanyResearch.candidate_pool_membership_id,
                              )
                              .where(
                                  Stage2CompanyResearch.candidate_pool_id == pool.id,
                                  Stage2CompanyResearch.candidate_pool_revision_id
                                  == pool_revision.id,
                                  Stage1CandidatePoolMembership.candidate_pool_revision_id
                                  == pool_revision.id,
                                  Stage1CandidatePoolMembership.beneficiary_id
                                  == Stage2CompanyResearch.beneficiary_id,
                                  Stage1CandidatePoolMembership.beneficiary_revision_id
                                  == Stage2CompanyResearch.beneficiary_revision_id,
                                  Stage2CompanyResearch.case_id == research_case.id,
                                  Stage2CompanyResearch.map_id == industry_map.id,
                                  Stage2CompanyResearch.selected_map_revision_id
                                  == map_revision.id,
                                  Stage2CompanyResearch.beneficiary_revision_id.in_(revision_ids),
                                  Stage2CompanyResearchRevision.information_cutoff_date
                                  <= as_of_cutoff,
                                  Stage2CompanyResearchRevision.recorded_at_utc
                                  <= recorded_boundary,
                              )
                              .order_by(
                                  Stage2CompanyResearch.id,
                                  Stage2CompanyResearchRevision.revision_no,
                              )
                          )
                      )
          '''
          old_company = '''            company_pair = latest_research.get(revision.id)
                      company_state = (
          '''
          new_company = '''            company_pair = latest_research.get(revision.id)
                      if company_pair is not None and (
                          company_pair[0].beneficiary_id != beneficiary.id
                          or company_pair[0].beneficiary_revision_id != revision.id
                          or company_pair[0].stock_basic_record_id
                          != revision.stock_basic_record_id
                          or company_pair[0].case_id != research_case.id
                          or company_pair[0].map_id != industry_map.id
                          or company_pair[0].selected_map_revision_id != map_revision.id
                      ):
                          raise IndustryThesisOwnerAcceptanceError(
                              "INDUSTRY_THESIS_ACCEPTANCE_OUTPUT_GRAPH_INCOMPLETE"
                          )
                      company_state = (
          '''

          if old_context in text:
              text = text.replace(old_context, new_context, 1)
              text = text.replace("            == best_contexts[0]\n", "            == selected_context\n", 1)
              text = text.replace(
                  '                    "compatible_frozen_stock_count": best_size,\n',
                  '                    "compatible_frozen_stock_count": len(compatible_stock_ids),\n',
                  1,
              )
          elif "selected_context, compatible_stock_ids" not in text:
              raise SystemExit("owner-context source did not match either accepted state")

          if old_research in text:
              text = text.replace(old_research, new_research, 1)
          elif "Stage2CompanyResearch.candidate_pool_membership_id" not in text:
              raise SystemExit("Company Research source did not match either accepted state")

          if old_company in text:
              text = text.replace(old_company, new_company, 1)
          elif "company_pair[0].beneficiary_revision_id != revision.id" not in text:
              raise SystemExit("Company Research member guard did not match either accepted state")

          path.write_text(text, encoding="utf-8")
          PY
          python -m py_compile industry_alpha/industry_thesis_owner_acceptance_workbench.py
          if ! git diff --quiet -- industry_alpha/industry_thesis_owner_acceptance_workbench.py; then
            git config user.name "AQuantAI CI Remediation"
            git config user.email "actions@users.noreply.github.com"
            git add industry_alpha/industry_thesis_owner_acceptance_workbench.py
            git commit -m "fix: make ordinary-user Workbench exact-context fail closed"
            git push origin "HEAD:${HEAD_BRANCH}"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -q -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q --tb=short --junitxml=pytest-results.xml

      - name: Upload temporary pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-diagnostics
          path: |
            pytest-results.xml
            industry_alpha/industry_thesis_owner_acceptance_workbench.py
          if-no-files-found: error
          retention-days: 1

      - name: Run local fixture demo
        run: python -m scripts.demo_research_flow

      - name: Run personal workbench fixture demo
        run: python -m scripts.demo_industry_analysis_workbench

      - name: Run candidate universe fixture demo
        run: python -m scripts.demo_industry_analysis_candidates

      - name: Run candidate review and exact result fixture demo
        run: python -m scripts.demo_industry_analysis_review

      - name: Run Today Market local snapshot fixture demo
        run: python -m scripts.demo_today_market

      - name: Run Phase 2B ordinary-user usability demo
        run: python -m scripts.demo_industry_analysis_phase2b

      - name: Run Industry Thesis ordinary-user acceptance fixture demo
        run: python -m scripts.run_industry_thesis_ordinary_user_acceptance_fixture

      - name: Run THS Stage C0 offline contract demo
        run: python -m scripts.demo_ths_stage_c0_offline

name: Local Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  pytest-and-demo:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aquantai
          POSTGRES_PASSWORD: aquantai
          POSTGRES_DB: aquantai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aquantai -d aquantai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://aquantai:aquantai@127.0.0.1:5432/aquantai_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -q -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q --tb=short

      - name: Run local fixture demo
        run: python -m scripts.demo_research_flow

      - name: Run personal workbench fixture demo
        run: python -m scripts.demo_industry_analysis_workbench

      - name: Run candidate universe fixture demo
        run: python -m scripts.demo_industry_analysis_candidates

      - name: Run candidate review and exact result fixture demo
        run: python -m scripts.demo_industry_analysis_review

      - name: Run Owner Context v2 acceptance fixture demo
        run: python -m scripts.demo_industry_analysis_acceptance_v2

      - name: Run Today Market local snapshot fixture demo
        run: python -m scripts.demo_today_market

      - name: Run Phase 2B ordinary-user usability demo
        run: python -m scripts.demo_industry_analysis_phase2b

      - name: Run THS Stage C0 offline contract demo
        run: python -m scripts.demo_ths_stage_c0_offline

  acceptance-v2-failure-diagnostic:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -q -e ".[dev]"

      - name: Run focused diagnostic
        run: |
          set +e
          python -m pytest -q --tb=short --maxfail=20 \
            tests/test_industry_analysis_acceptance_v2_api.py \
            tests/test_industry_analysis_acceptance_v2_static.py \
            tests/test_industry_thesis_owner_acceptance_workbench_v2_scale.py \
            > acceptance-v2-diagnostic.log 2>&1
          echo "$?" > acceptance-v2-exit-code.txt
          exit 0

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-v2-diagnostic-log
          path: |
            acceptance-v2-diagnostic.log
            acceptance-v2-exit-code.txt
          retention-days: 1

      - name: Preserve diagnostic result
        run: exit "$(cat acceptance-v2-exit-code.txt)"

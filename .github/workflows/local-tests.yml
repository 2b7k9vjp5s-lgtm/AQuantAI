name: Apply Today Market Refactor

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-authorized-refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Reuse reviewed refactor script
        run: |
          python - <<'PY'
          from pathlib import Path
          from subprocess import check_output
          from textwrap import dedent

          source = check_output(
              [
                  "git",
                  "show",
                  "b5f74374c31e3f06bad489d34ce7827c4b788328:.github/workflows/local-tests.yml",
              ],
              text=True,
          )
          lines = source.splitlines()
          start = next(
              index + 1
              for index, line in enumerate(lines)
              if line.strip() == "python - <<'PY'"
          )
          end = next(
              index
              for index in range(start, len(lines))
              if lines[index].strip() == "PY"
          )
          script = dedent("\n".join(lines[start:end])) + "\n"
          Path("/tmp/apply_today_market_refactor.py").write_text(
              script,
              encoding="utf-8",
          )
          PY
          python /tmp/apply_today_market_refactor.py
          git checkout -- .github/workflows/local-tests.yml

      - name: Validate exact non-workflow refactor
        run: |
          python -m py_compile \
            backend/api/today_market.py \
            backend/main.py \
            backend/today_market_refresh/__init__.py \
            backend/today_market_refresh/runtime.py \
            tests/test_today_market_runtime_integration.py
          node --check today_market/static/today_market.js
          python - <<'PY'
          import ast
          from pathlib import Path

          forbidden = (
              "requests",
              "httpx",
              "urllib.request",
              "socket",
              "subprocess",
              "sqlalchemy",
              "psycopg",
              "sqlite3",
          )
          path = Path("backend/today_market_refresh/runtime.py")
          for node in ast.walk(ast.parse(path.read_text(encoding="utf-8"))):
              if isinstance(node, ast.Import):
                  modules = [alias.name for alias in node.names]
              elif isinstance(node, ast.ImportFrom):
                  modules = [node.module or ""]
              else:
                  continue
              for module in modules:
                  assert not module.startswith(forbidden), module
          html = Path("today_market/static/today_market.html").read_text(
              encoding="utf-8"
          )
          assert "today-market-runtime-script" not in html
          assert "series_key" not in html
          PY
          expected=$(printf '%s\n' \
            backend/api/today_market.py \
            backend/main.py \
            backend/today_market_refresh/__init__.py \
            backend/today_market_refresh/runtime.py \
            tests/test_today_market_runtime_integration.py \
            today_market/static/today_market.html \
            today_market/static/today_market.js | sort)
          actual=$(git diff --name-only | sort)
          test "$actual" = "$expected"

      - name: Commit exact authorized refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/api/today_market.py \
            backend/main.py \
            backend/today_market_refresh/__init__.py \
            backend/today_market_refresh/runtime.py \
            tests/test_today_market_runtime_integration.py \
            today_market/static/today_market.html \
            today_market/static/today_market.js
          git commit -m "refactor: isolate Today Market runtime adapter (#261)"
          git push origin HEAD:${{ github.head_ref }}

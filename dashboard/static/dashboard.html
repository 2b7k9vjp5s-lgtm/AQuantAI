<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AQuantAI 只读研究看板</title>
    <link rel="stylesheet" href="/dashboard/static/dashboard.css">
  </head>
  <body>
    <header class="site-header">
      <div class="page-width">
        <p class="eyebrow">本地固定样例研究数据</p>
        <h1>AQuantAI 只读研究看板</h1>
        <p class="lede">仅供本地查看研究样例。本页面不使用实时市场数据，也不提供交易操作。</p>
        <nav aria-label="看板资源">
          <a href="/research-workspace">V1 研究工作台</a>
          <a href="/research-workspace/guide">新手操作指引</a>
          <a href="/dashboard/overview">总览 JSON</a>
          <a href="/dashboard/report">报告 JSON</a>
        </nav>
      </div>
    </header>
    <main class="page-width">
      <section class="status-panel" aria-labelledby="status-heading">
        <h2 id="status-heading">项目状态</h2>
        <p id="load-status" role="status">正在加载本地看板数据。</p>
        <p id="load-error" class="error" role="alert" hidden></p>
        <div id="project-status" class="metric-grid" aria-live="polite"></div>
      </section>

      <section aria-labelledby="factor-heading">
        <h2 id="factor-heading">因子摘要</h2>
        <div id="factor-summary"></div>
      </section>

      <section aria-labelledby="backtest-heading">
        <h2 id="backtest-heading">回测指标</h2>
        <div id="backtest-summary" class="metric-grid"></div>
      </section>

      <section aria-labelledby="ml-heading">
        <h2 id="ml-heading">机器学习预测摘要</h2>
        <div id="ml-summary"></div>
      </section>

      <section aria-labelledby="report-heading">
        <h2 id="report-heading">研究报告</h2>
        <div id="research-report"></div>
      </section>

      <section class="two-column" aria-label="研究背景">
        <div>
          <h2>重点内容</h2>
          <div id="report-highlights"></div>
        </div>
        <div>
          <h2>风险与限制</h2>
          <div id="research-risks"></div>
        </div>
      </section>

      <section aria-labelledby="sources-heading">
        <h2 id="sources-heading">来源引用</h2>
        <div id="source-references"></div>
      </section>
    </main>
    <footer class="site-footer">
      <div class="page-width">
        <h2>研究免责声明</h2>
        <p id="research-disclaimer">本报告仅用于量化研究和学习，不构成投资建议、交易推荐，也不构成买入、卖出或持有任何证券的指令。</p>
      </div>
    </footer>
    <script src="/dashboard/static/dashboard.js" defer></script>
  </body>
</html>
